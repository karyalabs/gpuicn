[workspace]
members = ["crates/ui", "crates/cli", "site", "xtask"]
resolver = "3"

[workspace.package]
version = "0.11.10"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/karyalabs/gpuicn"

[workspace.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit"] }
gpui-kit = { version = "=0.9.1", default-features = false, features = ["component"] }
gpui-icons = "0.7.0"

# Karya Labs' GPUI: the same gpui-pre crates and versions with additive patches
# (10-bit and HDR video surfaces on macOS). Only this workspace uses it; apps
# that install gpuicn keep stock gpui-pre unless they add the same lines.
# Moving the gpui-pre pin means rebasing the fork's patches first, see
# CONTRIBUTING.md.
[patch.crates-io]
gpui-pre-apple = { git = "https://github.com/karyalabs/zed", branch = "crates/gpui-pre-0.3.12" }
gpui-pre-macos = { git = "https://github.com/karyalabs/zed", branch = "crates/gpui-pre-0.3.12" }

[profile.dev]
debug = 1

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# The browser preview downloads the whole WASM binary before it can draw, so
# it trades build time for size: fat LTO and size-first optimization.
[profile.web]
inherits = "release"
opt-level = "z"
lto = "fat"
