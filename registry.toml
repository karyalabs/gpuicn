name = "gpuicn"
homepage = "https://ui.imajha.com/"

# The one list of components. The registry JSON, the website's pages and the
# gallery app are all generated from it; nothing else names a component.
#
# title        Shown on the site and in `gpuicn list`. Defaults to the module
#              name in title case.
# description  One sentence for the catalog.
# category     One of the groups below; the site and the gallery group by it.
# since        The release that first shipped the component. Write "next" for
#              a new one: `scripts/release-version.py bump` stamps the version
#              and the site derives its "New" badges from it.
# preview_height  Height in pixels of the preview frame on the component's
#              page, when the default 288 is too short.
# dependencies Other components its source needs. Every component includes
#              theme; dependencies are recursive and installed once.

[[categories]]
id = "foundations"
title = "Foundations"

[[categories]]
id = "actions"
title = "Actions"

[[categories]]
id = "forms"
title = "Forms"

[[categories]]
id = "overlays"
title = "Overlays"

[[categories]]
id = "navigation"
title = "Navigation and layout"

[[categories]]
id = "display"
title = "Data display"

[[categories]]
id = "chat"
title = "Chat"

# Foundations

[components.app]
description = "One-call application start: icon assets, bundled Geist fonts, the theme pair and the first window."
category = "foundations"
since = "0.9.0"

[components.theme]
description = "The app-owned shadcn Neutral theme and shared native motion tokens for GPUI."
category = "foundations"
since = "0.1.0"

# Actions

[components.button]
description = "Displays a button or a component that looks like a button."
category = "actions"
since = "0.1.0"

[components.kbd]
description = "Shows a keyboard key or shortcut with platform modifier names."
category = "actions"
since = "0.6.0"

[components.toggle]
description = "A two-state button that can be on or off."
category = "actions"
since = "0.2.0"

[components.toggle_group]
description = "Groups two-state buttons with shared selection."
category = "actions"
since = "0.2.0"

[components.toolbar]
description = "Groups controls for a related set of actions."
category = "actions"
since = "0.2.0"
dependencies = ["input"]

